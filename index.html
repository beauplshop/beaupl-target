<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뷰플샵 발송 타겟 선별기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd7;
    --text: #1c1917;
    --text-muted: #78716c;
    --accent: #c2410c;       /* 뷰플샵 오렌지 계열 */
    --accent-light: #fff7ed;
    --accent-mid: #fdba74;
    --green: #166534;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --blue: #1e40af;
    --blue-bg: #eff6ff;
    --blue-border: #bfdbfe;
    --yellow-bg: #fefce8;
    --yellow-border: #fde68a;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --font-sans: 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,.10);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--font-sans); background:var(--bg); color:var(--text); font-size:14px; line-height:1.6; min-height:100vh; }

  /* HEADER */
  header {
    background:var(--text);
    color:#fafaf9;
    padding:20px 32px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header .logo { font-size:17px; font-weight:700; letter-spacing:-.3px; }
  header .logo span { color:var(--accent-mid); }
  header .subtitle { font-size:11px; color:#a8a29e; margin-top:2px; }
  .step-bar { display:flex; gap:6px; align-items:center; }
  .step-dot {
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700;
    background:#44403c; color:#a8a29e;
    transition:.2s;
  }
  .step-dot.active { background:var(--accent); color:white; }
  .step-dot.done { background:#166534; color:white; }
  .step-line { width:24px; height:2px; background:#44403c; }

  /* LAYOUT */
  main { max-width:960px; margin:0 auto; padding:28px 20px 60px; }

  /* CARDS */
  .card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .card-title {
    font-size:13px; font-weight:700; color:var(--text);
    margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }
  .card-title .num {
    width:22px; height:22px; background:var(--accent); color:white;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; flex-shrink:0;
  }

  /* INPUTS */
  label { font-size:12px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:5px; }
  input[type=text], input[type=password], select {
    width:100%; padding:9px 12px;
    border:1px solid var(--border); border-radius:var(--radius-sm);
    font-size:13px; font-family:var(--font-sans); color:var(--text);
    background:var(--surface); outline:none; transition:.15s;
  }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(194,65,12,.12); }
  input[type=file] { display:none; }

  .input-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:600px) { .input-row { grid-template-columns:1fr; } }

  /* UPLOAD ZONE */
  .upload-zone {
    border:2px dashed var(--border); border-radius:var(--radius);
    padding:28px; text-align:center; cursor:pointer;
    transition:.2s; background:var(--surface2);
  }
  .upload-zone:hover { border-color:var(--accent); background:var(--accent-light); }
  .upload-zone.has-file { border-color:#166534; background:var(--green-bg); border-style:solid; }
  .upload-zone .icon { font-size:28px; margin-bottom:8px; }
  .upload-zone .text { font-size:13px; color:var(--text-muted); }
  .upload-zone .file-name { font-size:12px; font-weight:700; color:var(--green); margin-top:6px; }

  /* BUTTONS */
  .btn {
    padding:10px 20px; border-radius:var(--radius-sm); font-size:13px;
    font-weight:700; cursor:pointer; border:none; transition:.15s;
    font-family:var(--font-sans); display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary { background:var(--accent); color:white; }
  .btn-primary:hover { background:#9a3412; }
  .btn-primary:disabled { background:#d6d3d1; cursor:not-allowed; }
  .btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover { background:var(--border); }
  .btn-green { background:#166534; color:white; }
  .btn-green:hover { background:#14532d; }
  .btn-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  /* PROGRESS */
  .progress-wrap { margin:14px 0; }
  .progress-bar-bg { background:var(--surface2); border-radius:20px; height:8px; overflow:hidden; }
  .progress-bar-fill { height:100%; background:var(--accent); border-radius:20px; transition:width .3s; }
  .progress-text { font-size:11px; color:var(--text-muted); margin-top:5px; }

  /* STATUS */
  .status {
    padding:10px 14px; border-radius:var(--radius-sm);
    font-size:12px; margin-top:10px; display:none;
  }
  .status.info { background:var(--blue-bg); color:var(--blue); border:1px solid var(--blue-border); display:block; }
  .status.success { background:var(--green-bg); color:var(--green); border:1px solid var(--green-border); display:block; }
  .status.error { background:var(--red-bg); color:#991b1b; border:1px solid var(--red-border); display:block; }
  .status.warning { background:var(--yellow-bg); color:#92400e; border:1px solid var(--yellow-border); display:block; }

  /* KPI ROW */
  .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  @media(max-width:600px) { .kpi-row { grid-template-columns:repeat(2,1fr); } }
  .kpi {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px;
    border-top:3px solid var(--accent);
  }
  .kpi-label { font-size:10px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px; }
  .kpi-val { font-size:24px; font-weight:800; color:var(--text); margin:4px 0 2px; }
  .kpi-sub { font-size:11px; color:var(--text-muted); }

  /* TABLE */
  .table-wrap { overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  thead th {
    background:var(--text); color:#fafaf9;
    padding:9px 12px; text-align:left; font-size:11px;
    font-weight:700; white-space:nowrap;
  }
  tbody tr { border-bottom:1px solid var(--border); }
  tbody tr:hover td { background:var(--surface2); }
  tbody td { padding:8px 12px; color:var(--text); }
  .badge {
    display:inline-block; padding:2px 8px; border-radius:20px;
    font-size:10px; font-weight:700;
  }
  .badge-a { background:#dcfce7; color:#166534; }
  .badge-b { background:#dbeafe; color:#1e40af; }
  .score-bar { display:flex; align-items:center; gap:6px; }
  .score-fill { height:6px; border-radius:3px; background:var(--accent); }
  .score-num { font-size:11px; font-weight:700; color:var(--text-muted); min-width:20px; }

  /* LOG */
  .log {
    background:#1c1917; color:#a8a29e; border-radius:var(--radius);
    padding:14px 16px; font-family:var(--font-mono); font-size:11px;
    line-height:1.8; max-height:180px; overflow-y:auto; margin-top:12px;
    display:none;
  }
  .log.show { display:block; }
  .log .ok { color:#86efac; }
  .log .warn { color:#fde68a; }
  .log .err { color:#fca5a5; }

  /* SECTION DIVIDER */
  .divider { border:none; border-top:1px solid var(--border); margin:20px 0; }

  /* HIDDEN */
  .hidden { display:none !important; }

  /* FILTER ROW */
  .filter-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end; }
  .filter-row > div { flex:1; min-width:120px; }

  /* TOOLTIP */
  .tip {
    display:inline-block; width:16px; height:16px; background:var(--surface2);
    border:1px solid var(--border); border-radius:50%; text-align:center;
    line-height:15px; font-size:10px; color:var(--text-muted); cursor:help;
    margin-left:4px;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">뷰플샵 <span>타겟 선별기</span></div>
    <div class="subtitle">미용업 인허가 API → 발송 대상 자동 선별</div>
  </div>
  <div class="step-bar">
    <div class="step-dot active" id="s1">1</div>
    <div class="step-line"></div>
    <div class="step-dot" id="s2">2</div>
    <div class="step-line"></div>
    <div class="step-dot" id="s3">3</div>
    <div class="step-line"></div>
    <div class="step-dot" id="s4">4</div>
  </div>
</header>

<main>

  <!-- STEP 1: API 키 -->
  <div class="card" id="card1">
    <div class="card-title"><div class="num">1</div> API 키 설정</div>
    <div class="input-row">
      <div>
        <label>공공데이터포털 API 키 <span class="tip" title="data.go.kr → 마이페이지 → 인증키">?</span></label>
        <input type="password" id="apiKey" placeholder="발급받은 인증키 입력">
      </div>
      <div>
        <label>기준 연월 (인허가일자 필터)</label>
        <input type="text" id="targetMonth" placeholder="예: 202506" maxlength="6">
      </div>
    </div>
    <div style="margin-top:10px;">
      <label>
        <input type="checkbox" id="saveKey" style="width:auto;margin-right:4px;">
        <span style="font-size:12px; color:var(--text-muted);">이 브라우저에 API 키 저장 (팀원 개인 설정용)</span>
      </label>
    </div>
    <div class="status info" id="apiStatus">
      API 키는 브라우저에서 직접 data.go.kr을 호출하는 데만 사용됩니다. 서버에 전송되지 않습니다.
    </div>
  </div>

  <!-- STEP 2: 기존 회원 + 발송 이력 업로드 -->
  <div class="card" id="card2">
    <div class="card-title"><div class="num">2</div> 기존 데이터 업로드 (제외 처리용)</div>
    <div class="input-row">
      <div>
        <div class="upload-zone" id="memberZone" onclick="document.getElementById('memberFile').click()">
          <div class="icon">📊</div>
          <div class="text">뷰플샵 회원 엑셀 (고객RAW 시트)<br><small>손익분석_뷰플샵.xlsx</small></div>
          <div class="file-name" id="memberFileName"></div>
        </div>
        <input type="file" id="memberFile" accept=".xlsx,.xls" onchange="handleMemberFile(this)">
      </div>
      <div>
        <div class="upload-zone" id="sentZone" onclick="document.getElementById('sentFile').click()">
          <div class="icon">📬</div>
          <div class="text">과거 발송 이력 엑셀<br><small>발송_뷰플샵YYYYMMDD_*.xlsx (복수 가능)</small></div>
          <div class="file-name" id="sentFileName"></div>
        </div>
        <input type="file" id="sentFile" accept=".xlsx,.xls" multiple onchange="handleSentFile(this)">
      </div>
    </div>
    <div class="status" id="uploadStatus"></div>
  </div>

  <!-- STEP 3: 조회 설정 + 실행 -->
  <div class="card" id="card3">
    <div class="card-title"><div class="num">3</div> 조회 설정 및 실행</div>
    <div class="input-row" style="margin-bottom:14px;">
      <div>
        <label>업태 구분</label>
        <select id="bizType">
          <option value="일반미용업">일반미용업 (헤어만)</option>
          <option value="종합미용업">종합미용업 포함</option>
        </select>
      </div>
      <div>
        <label>발송 그룹 분할 기준</label>
        <select id="groupBy">
          <option value="age">영업연수 (A: 1~2년 / B: 7~10년)</option>
          <option value="region">지역 (A: 지방중소시 / B: 수도권)</option>
          <option value="score">점수 상위 (A/B 균등 분할)</option>
        </select>
      </div>
    </div>
    <div class="input-row" style="margin-bottom:16px;">
      <div>
        <label>총 발송 목표 수</label>
        <select id="topN">
          <option value="1000">1,000매</option>
          <option value="2000" selected>2,000매 (권장 — A/B 각 1,000)</option>
          <option value="3000">3,000매</option>
        </select>
      </div>
      <div>
        <label>최소 스코어 필터</label>
        <select id="minScore">
          <option value="0">제한 없음</option>
          <option value="25">25점 이상</option>
          <option value="27" selected>27점 이상 (권장)</option>
          <option value="29">29점 이상 (고품질만)</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="runFetch()" id="runBtn">
        ▶ 인허가 데이터 조회 및 선별 시작
      </button>
      <span id="runHint" style="font-size:11px; color:var(--text-muted);">
        API 호출 → 필터링 → 스코어링 → 상위 선별
      </span>
    </div>
    <div class="progress-wrap hidden" id="progressWrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-text" id="progressText">준비 중...</div>
    </div>
    <div class="log" id="fetchLog"></div>
  </div>

  <!-- STEP 4: 결과 -->
  <div class="card hidden" id="card4">
    <div class="card-title"><div class="num">4</div> 선별 결과</div>

    <div class="kpi-row" id="kpiRow"></div>

    <div class="filter-row">
      <div>
        <label>그룹 필터</label>
        <select id="filterGroup" onchange="renderTable()">
          <option value="">전체</option>
          <option value="A">A그룹만</option>
          <option value="B">B그룹만</option>
        </select>
      </div>
      <div>
        <label>지역 필터</label>
        <select id="filterRegion" onchange="renderTable()">
          <option value="">전체</option>
        </select>
      </div>
      <div>
        <label>정렬</label>
        <select id="sortBy" onchange="renderTable()">
          <option value="score">점수 높은 순</option>
          <option value="age_new">영업연수 낮은 순 (신규)</option>
          <option value="age_old">영업연수 높은 순</option>
        </select>
      </div>
      <div style="display:flex; gap:8px; align-items:flex-end;">
        <button class="btn btn-green" onclick="downloadExcel()">⬇ 엑셀 다운로드</button>
        <button class="btn btn-secondary" onclick="copyCSV()">📋 CSV 복사</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>순위</th><th>그룹</th><th>사업장명</th><th>주소</th>
            <th>우편번호</th><th>연수구간</th><th>의자수</th><th>점수</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
    <div style="margin-top:10px; font-size:11px; color:var(--text-muted);" id="tableCount"></div>
  </div>

</main>

<script>
// ── 상수: 스코어링 가중치 (뷰플샵 데이터 검증 기반) ──────────────────
const REGION_SCORE = {
  '대전':10,'광주':9,'울산':9,'경기':8,'대구':8,
  '인천':8,'서울':7,'부산':7,'강원':7,'경남':7,
  '경북':7,'전북':7,'전남':6,'충남':6,'충북':5,'제주':5,'세종':5
};
const AGE_SCORE = {
  '1~2년':10,'7~10년':9,'5~7년':8,'2~3년':8,
  '3~5년':7,'1년미만':7,'10~15년':7,'15년+':5
};

// ── 저장된 키 불러오기 ──────────────────────────────────────────────
window.addEventListener('load', () => {
  const saved = localStorage.getItem('beaupl_api_key');
  if (saved) {
    document.getElementById('apiKey').value = saved;
    document.getElementById('saveKey').checked = true;
  }
  const ym = new Date();
  document.getElementById('targetMonth').value =
    String(ym.getFullYear()) + String(ym.getMonth()+1).padStart(2,'0');
});

// ── 정규화 ──────────────────────────────────────────────────────────
function normName(n) {
  if (!n) return '';
  return n.replace(/\s+/g,'').toLowerCase()
    .replace(/(미용원|미용실|헤어샵|헤어살롱|살롱|뷰티|beauty|hair|shop|샵|헤어$)/g,'');
}

// ── 회원 엑셀 파싱 ──────────────────────────────────────────────────
let enrolledNames = new Set();
let sentNames     = new Set();

function handleMemberFile(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, {type:'binary'});
      const ws = wb.Sheets['고객RAW'] || wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, {defval:''});
      enrolledNames = new Set(data.map(r => normName(r['상호'] || r['사업장명'] || '')).filter(Boolean));
      document.getElementById('memberFileName').textContent = `✅ ${file.name} (${enrolledNames.size.toLocaleString()}명 로드)`;
      document.getElementById('memberZone').classList.add('has-file');
      showStatus('uploadStatus', `회원 데이터 ${enrolledNames.size.toLocaleString()}개 로드 완료`, 'success');
    } catch(err) {
      showStatus('uploadStatus', '파일 파싱 오류: ' + err.message, 'error');
    }
  };
  reader.readAsBinaryString(file);
}

function handleSentFile(input) {
  const files = Array.from(input.files); if (!files.length) return;
  let total = 0;
  let done  = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'binary'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, {defval:''});
        data.forEach(r => {
          const n = normName(r['comp'] || r['사업장명'] || r['상호'] || '');
          if (n) sentNames.add(n);
        });
        total += data.length;
      } catch(e) {}
      done++;
      if (done === files.length) {
        document.getElementById('sentFileName').textContent = `✅ ${files.length}개 파일 (${sentNames.size.toLocaleString()}개 이력)`;
        document.getElementById('sentZone').classList.add('has-file');
        showStatus('uploadStatus', `발송 이력 ${sentNames.size.toLocaleString()}개 로드 완료`, 'success');
      }
    };
    reader.readAsBinaryString(file);
  });
}

// ── 유틸 ──────────────────────────────────────────────────────────
function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.className = `status ${type}`;
  el.textContent = msg;
}

function log(msg, type='') {
  const el = document.getElementById('fetchLog');
  el.classList.add('show');
  const cls = type === 'ok' ? 'ok' : type === 'warn' ? 'warn' : type === 'err' ? 'err' : '';
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function setProgress(pct, text) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = text;
}

function ageLabel(years) {
  if (years < 1)  return '1년미만';
  if (years < 2)  return '1~2년';
  if (years < 3)  return '2~3년';
  if (years < 5)  return '3~5년';
  if (years < 7)  return '5~7년';
  if (years < 10) return '7~10년';
  if (years < 15) return '10~15년';
  return '15년+';
}

function scoreRow(item, refDate) {
  const addr = item.rdnWhlAddr || item.sitewhlAddr || '';
  const region = Object.keys(REGION_SCORE).find(r => addr.includes(r)) || '';
  const sRegion = REGION_SCORE[region] || 5;

  let sAge = 5;
  if (item.apvPermYmd) {
    const d = item.apvPermYmd.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
    const years = (refDate - new Date(d)) / (1000*60*60*24*365.25);
    if (!isNaN(years)) sAge = AGE_SCORE[ageLabel(Math.max(years, 0))] || 5;
  }

  const chairs = parseFloat(item.seatingCapacity || 0);
  const sChair = chairs <= 3 ? 8 : chairs <= 5 ? 9 : chairs <= 8 ? 5 : 3;

  const area = parseFloat(item.sitewhlAddr || 0); // 면적 필드명 확인 필요
  const sArea = 0; // 면적 데이터 없을 때 0

  return { sRegion, sAge, sChair, total: sRegion + sAge + sChair + sArea, region, ageLabel: ageLabel((refDate - new Date((item.apvPermYmd||'20000101').replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'))) / (1000*60*60*24*365.25)) };
}

// ── 메인: API 조회 + 선별 ─────────────────────────────────────────
let resultData = [];

async function runFetch() {
  const apiKey   = document.getElementById('apiKey').value.trim();
  const topN     = parseInt(document.getElementById('topN').value);
  const minScore = parseInt(document.getElementById('minScore').value);
  const bizType  = document.getElementById('bizType').value;
  const groupBy  = document.getElementById('groupBy').value;

  if (!apiKey) { alert('API 키를 입력해주세요.'); return; }

  if (document.getElementById('saveKey').checked) {
    localStorage.setItem('beaupl_api_key', apiKey);
  }

  // UI 초기화
  document.getElementById('runBtn').disabled = true;
  document.getElementById('progressWrap').classList.remove('hidden');
  document.getElementById('fetchLog').innerHTML = '';
  document.getElementById('card4').classList.add('hidden');
  setProgress(0, '준비 중...');

  const refDate = new Date('2026-01-01');
  const PAGE_SIZE = 1000;
  let allItems = [];
  let page = 1;
  let totalCount = 0;

  try {
    // 1차 호출 — 총 건수 파악
    log('▶ API 호출 시작...');
    setProgress(5, '총 건수 확인 중...');

    const baseUrl = 'https://apis.data.go.kr/B553077/API01/searchUpso';
    const params = new URLSearchParams({
      serviceKey: apiKey,
      pageIndex: '1',
      pageSize: '1',
      upsoTypeGb: '05_18_01',   // 일반미용업 코드
      indscdNm: bizType === '일반미용업' ? '일반미용업' : '',
      resultType: 'json',
    });

    let res, data;
    try {
      res  = await fetch(`${baseUrl}?${params}`);
      data = await res.json();
    } catch(e) {
      // CORS 우회: 직접 호출이 막힌 경우 안내
      throw new Error('CORS 오류: API를 직접 호출할 수 없습니다. 아래 안내를 확인하세요.');
    }

    totalCount = data?.body?.totalCount || data?.response?.body?.totalCount || 0;
    if (!totalCount) throw new Error('응답 오류: ' + JSON.stringify(data).slice(0, 200));

    log(`총 ${totalCount.toLocaleString()}개 매장 확인`, 'ok');
    const totalPages = Math.ceil(totalCount / PAGE_SIZE);
    log(`${totalPages}페이지 순차 호출 예정 (페이지당 ${PAGE_SIZE}건)`);

    // 전체 페이지 수집
    for (page = 1; page <= Math.min(totalPages, 80); page++) {
      setProgress(5 + Math.round(page / Math.min(totalPages, 80) * 60), `데이터 수집 중... ${page}/${Math.min(totalPages, 80)}페이지`);
      const p2 = new URLSearchParams({
        serviceKey: apiKey,
        pageIndex: String(page),
        pageSize: String(PAGE_SIZE),
        upsoTypeGb: '05_18_01',
        resultType: 'json',
      });
      const r2   = await fetch(`${baseUrl}?${p2}`);
      const d2   = await r2.json();
      const items = d2?.body?.items || d2?.response?.body?.items?.item || [];
      const arr   = Array.isArray(items) ? items : [items];
      allItems.push(...arr);
      if (page % 5 === 0) log(`  ${allItems.length.toLocaleString()}개 수집 완료`);
      await new Promise(r => setTimeout(r, 100)); // 레이트리밋 방지
    }

    log(`총 ${allItems.length.toLocaleString()}개 수집 완료`, 'ok');
    setProgress(70, '필터링 및 스코어링 중...');

    // 필터링 + 제외 + 스코어링
    let scored = [];
    for (const item of allItems) {
      const name = item.upsoNm || item.bizplcNm || '';
      const nn   = normName(name);
      if (!nn) continue;
      if (enrolledNames.has(nn)) continue;   // 기가입
      if (sentNames.has(nn)) continue;        // 발송이력

      const sc = scoreRow(item, refDate);
      if (sc.total < minScore) continue;

      scored.push({
        name,
        addr: item.rdnWhlAddr || item.sitewhlAddr || '',
        zipcode: item.rdnPostNo || item.postNo || '',
        ageLabel: sc.ageLabel,
        chairs: item.seatingCapacity || '',
        score: sc.total,
        region: sc.region,
        licenseDate: item.apvPermYmd || '',
        nn,
        _sc: sc,
      });
    }

    log(`필터 후 후보: ${scored.length.toLocaleString()}개`, 'ok');
    setProgress(80, '그룹 분할 및 상위 선별 중...');

    // 그룹 분할
    scored.sort((a,b) => b.score - a.score);

    let grpA = [], grpB = [];
    if (groupBy === 'age') {
      grpA = scored.filter(r => r.ageLabel === '1~2년');
      grpB = scored.filter(r => r.ageLabel === '7~10년');
    } else if (groupBy === 'region') {
      const metro = ['서울','경기','인천'];
      grpA = scored.filter(r => !metro.includes(r.region));
      grpB = scored.filter(r =>  metro.includes(r.region));
    } else {
      grpA = scored.filter((_,i) => i % 2 === 0);
      grpB = scored.filter((_,i) => i % 2 === 1);
    }

    const half = Math.floor(topN / 2);
    grpA = grpA.slice(0, half).map(r => ({...r, group:'A'}));
    grpB = grpB.slice(0, half).map(r => ({...r, group:'B'}));
    resultData = [...grpA, ...grpB];

    log(`A그룹: ${grpA.length}개 / B그룹: ${grpB.length}개`, 'ok');
    setProgress(95, '결과 렌더링 중...');

    // 지역 필터 옵션 채우기
    const regions = [...new Set(resultData.map(r => r.region).filter(Boolean))].sort();
    const sel = document.getElementById('filterRegion');
    sel.innerHTML = '<option value="">전체</option>' +
      regions.map(r => `<option value="${r}">${r}</option>`).join('');

    // KPI
    document.getElementById('kpiRow').innerHTML = `
      <div class="kpi"><div class="kpi-label">총 선별</div><div class="kpi-val">${resultData.length.toLocaleString()}</div><div class="kpi-sub">발송 대상</div></div>
      <div class="kpi"><div class="kpi-label">A그룹</div><div class="kpi-val">${grpA.length.toLocaleString()}</div><div class="kpi-sub">${groupBy==='age'?'1~2년차':groupBy==='region'?'지방중소시':'점수 상위 짝수'}</div></div>
      <div class="kpi"><div class="kpi-label">B그룹</div><div class="kpi-val">${grpB.length.toLocaleString()}</div><div class="kpi-sub">${groupBy==='age'?'7~10년차':groupBy==='region'?'수도권':'점수 상위 홀수'}</div></div>
      <div class="kpi"><div class="kpi-label">기가입/발송 제외</div><div class="kpi-val">${(allItems.length - scored.length - resultData.length).toLocaleString()}</div><div class="kpi-sub">중복 제거 완료</div></div>
    `;

    renderTable();
    document.getElementById('card4').classList.remove('hidden');
    document.getElementById('card4').scrollIntoView({behavior:'smooth', block:'start'});
    setProgress(100, `완료 — ${resultData.length}개 선별`);

    // 스텝 업데이트
    ['s1','s2','s3'].forEach(id => {
      document.getElementById(id).className = 'step-dot done';
    });
    document.getElementById('s4').className = 'step-dot active';

  } catch(err) {
    log('오류: ' + err.message, 'err');
    if (err.message.includes('CORS')) {
      log('→ 해결법: GitHub Pages로 배포하거나 CORS 프록시 사용 필요', 'warn');
      log('→ 임시 방법: https://cors-anywhere.herokuapp.com/ 프록시 활용', 'warn');
    }
    setProgress(0, '오류 발생');
  } finally {
    document.getElementById('runBtn').disabled = false;
  }
}

// ── 테이블 렌더 ─────────────────────────────────────────────────────
function renderTable() {
  const filterGroup  = document.getElementById('filterGroup').value;
  const filterRegion = document.getElementById('filterRegion').value;
  const sortBy       = document.getElementById('sortBy').value;

  let rows = [...resultData];
  if (filterGroup)  rows = rows.filter(r => r.group === filterGroup);
  if (filterRegion) rows = rows.filter(r => r.region === filterRegion);

  if (sortBy === 'score')   rows.sort((a,b) => b.score - a.score);
  if (sortBy === 'age_new') rows.sort((a,b) => (a.licenseDate||'').localeCompare(b.licenseDate||''));
  if (sortBy === 'age_old') rows.sort((a,b) => (b.licenseDate||'').localeCompare(a.licenseDate||''));

  const MAX_SCORE = 31;
  const tbody = document.getElementById('resultBody');
  tbody.innerHTML = rows.slice(0, 200).map((r, i) => `
    <tr>
      <td>${i+1}</td>
      <td><span class="badge ${r.group==='A'?'badge-a':'badge-b'}">${r.group}</span></td>
      <td><strong>${r.name}</strong></td>
      <td style="max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${r.addr}">${r.addr}</td>
      <td>${r.zipcode}</td>
      <td>${r.ageLabel}</td>
      <td>${r.chairs}</td>
      <td>
        <div class="score-bar">
          <div class="score-fill" style="width:${Math.round(r.score/MAX_SCORE*60)}px"></div>
          <span class="score-num">${r.score}</span>
        </div>
      </td>
    </tr>
  `).join('');

  document.getElementById('tableCount').textContent =
    `${rows.length.toLocaleString()}개 표시 중 (최대 200행 미리보기 / 전체 다운로드는 엑셀 버튼)`;
}

// ── 엑셀 다운로드 ────────────────────────────────────────────────────
function downloadExcel() {
  if (!resultData.length) return;
  const rows = resultData.map((r, i) => ({
    순위: i+1,
    그룹: r.group,
    사업장명: r.name,
    주소: r.addr,
    우편번호: r.zipcode,
    연수구간: r.ageLabel,
    의자수: r.chairs,
    우선순위점수: r.score,
    인허가일자: r.licenseDate,
    시도: r.region,
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), '발송대상전체');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.filter(r=>r.그룹==='A')), 'A그룹');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.filter(r=>r.그룹==='B')), 'B그룹');

  const date = new Date().toISOString().slice(0,10).replace(/-/g,'');
  XLSX.writeFile(wb, `뷰플샵_발송대상_${date}.xlsx`);
}

function copyCSV() {
  if (!resultData.length) return;
  const header = '순위,그룹,사업장명,주소,우편번호,연수구간,점수';
  const rows = resultData.map((r,i) =>
    `${i+1},${r.group},"${r.name}","${r.addr}",${r.zipcode},${r.ageLabel},${r.score}`
  );
  navigator.clipboard.writeText([header,...rows].join('\n'));
  alert('CSV가 클립보드에 복사됐어요.');
}
